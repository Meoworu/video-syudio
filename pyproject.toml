[project]
name = "video-studio"
version = "0.1.0"
description = "Google Vertex AI video studio with MiniMax continuous narration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-auth>=2.0",
    "google-cloud-storage>=3.0",
    "google-genai>=2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

